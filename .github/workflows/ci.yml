name: git2go CI
on:
  pull_request:
  push:
    branches:
    - main
    - release-*
    - v*

jobs:

  build-static:
    strategy:
      fail-fast: false
      matrix:
        go: [ '1.18', 'stable' ]
    name: Go ${{ matrix.go }}

    runs-on: ubuntu-latest

    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}
      id: go
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Build
      run: |
        sudo apt-get install -y --no-install-recommends libssh2-1-dev
        make build-libgit2-static
    - name: Test
      run:  make TEST_ARGS=-test.v test-static

  build-static-macos:
    name: Go (bundled static, macOS)
    runs-on: macos-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'
    - name: Check out code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Build libgit2
      run: make build-libgit2-static
    - name: Test
      run: make TEST_ARGS=-test.v test-static

  build-dynamic:
    strategy:
      fail-fast: false
    name: Go (dynamic)

    runs-on: ubuntu-latest

    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'
      id: go
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Build
      run: |
        sudo apt-get install -y --no-install-recommends libssh2-1-dev
        make build-libgit2-dynamic
    - name: Test
      run: make TEST_ARGS=-test.v test-dynamic

  build-static-deprecate-hard:
    name: Go (bundled static, DEPRECATE_HARD=ON)
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'
    - name: Check out code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Build libgit2 with hard-deprecated APIs hidden
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libssh2-1-dev
        DEPRECATE_HARD=ON make build-libgit2-static
    - name: Test
      run: make TEST_ARGS=-test.v test-static
    # Building against a DEPRECATE_HARD=ON libgit2 only proves we do not *link*
    # deprecated symbols; the headers still declare them. Defining
    # GIT_DEPRECATE_HARD for cgo additionally proves we do not *reference* any
    # hard-deprecated type, macro or struct field.
    - name: Test with GIT_DEPRECATE_HARD defined for cgo
      run: CGO_CFLAGS=-DGIT_DEPRECATE_HARD make TEST_ARGS=-test.v test-static

  build-system-dynamic:
    name: Go (system-wide, dynamic, promoted SHA256 baseline)

    runs-on: ubuntu-latest

    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'
      id: go
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
    - name: Build pinned libgit2 baseline system-wide
      run: |
        git submodule update --init
        sudo apt-get install -y --no-install-recommends libssh2-1-dev
        sudo ./script/build-libgit2.sh --dynamic --system
    - name: Test
      run: make TEST_ARGS=-test.v test

  build-system-static:
    strategy:
      fail-fast: false
    name: Go (system-wide, static)

    runs-on: ubuntu-latest

    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'
      id: go
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
    - name: Build libgit2
      run: |
        git submodule update --init
        sudo apt-get install -y --no-install-recommends libssh2-1-dev
        sudo ./script/build-libgit2.sh --static --system
    - name: Test
      run: go test --count=1 --tags "static,system_libgit2" ./...

  check-generate:
    name: Check generated files were not modified
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'
      id: go
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
    - name: Install libgit2 build dependencies
      run: |
        git submodule update --init
        sudo apt-get install -y --no-install-recommends libssh2-1-dev
        go install golang.org/x/tools/cmd/stringer@latest
    - name: Generate files
      run: |
        export PATH=$(go env GOPATH)/bin:$PATH
        make generate
    - name: Check nothing changed
      run: git diff --quiet --exit-code || (echo "detected changes after generate" ; git status ; exit 1)
