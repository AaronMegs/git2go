name: git2go CI
on:
  pull_request:
  push:
    branches:
    - main
    - release-*
    - v*

jobs:
  build-static:
    strategy:
      fail-fast: false
      matrix:
        go: [ '1.18', 'stable' ]
    name: Go ${{ matrix.go }} (bundled main, static)
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}
    - name: Check out code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Build libgit2
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libssh2-1-dev
        make build-libgit2-static
    - name: Test
      run: make TEST_ARGS=-test.v test-static

  build-static-macos:
    name: Go (bundled main, static, macOS)
    runs-on: macos-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: stable
    - name: Check out code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Build libgit2
      run: make build-libgit2-static
    - name: Test
      run: make TEST_ARGS=-test.v test-static

  build-dynamic:
    name: Go (bundled main, dynamic)
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: stable
    - name: Check out code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Build libgit2
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libssh2-1-dev
        make build-libgit2-dynamic
    - name: Test
      run: make TEST_ARGS=-test.v test-dynamic

  # Real stable track: build and test against released libgit2 v1.9.4 with no
  # libgit2_reftable build tag. This verifies that main-only fields and symbols
  # are fully isolated instead of merely compiling a reduced API against main.
  build-stable-v1-9-4:
    name: Stable compatibility (libgit2 v1.9.4, tag off)
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: stable
    - name: Check out code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Build libgit2 v1.9.4
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libssh2-1-dev
        git -C vendor/libgit2 fetch --tags --force
        BUILD_LIBGIT_REF=v1.9.4 make build-libgit2-static
    - name: Build core subset
      run: go build --tags static ./...
    - name: Test core subset
      run: make REFTABLE_TAG= TEST_ARGS=-test.v test-static

  # Main/reftable track: exercises the backend itself and the Go-defined
  # backend bridge v2, including per-iterator handles and transaction locks.
  build-reftable:
    name: Reftable (bundled main, tag on)
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: stable
    - name: Check out code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Build libgit2 main
      run: make build-libgit2-static
    - name: Run reftable/refdb suite
      run: |
        go test --count=1 --tags "static libgit2_reftable" -v \
          -run 'Reftable|Refdb|RefStorage|InitRepositoryExt|IsReftableSupported|OpenRefdb|Transaction' ./...
    - name: Run bridge concurrency tests with race detector
      run: |
        go test --count=1 --race --tags "static libgit2_reftable" -v \
          -run 'TestRefdbBackendConcurrentIterators|TestRefdbBackendTransaction' ./...

  build-static-deprecate-hard:
    name: Go (bundled main, static, DEPRECATE_HARD=ON)
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: stable
    - name: Check out code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Build libgit2 with deprecated APIs hidden
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libssh2-1-dev
        BUILD_DEPRECATED_HARD=ON make build-libgit2-static
    - name: Test
      run: make TEST_ARGS=-test.v test-static

  build-system-dynamic-v1-9-4:
    name: Go (system-wide dynamic, libgit2 v1.9.4)
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: stable
    - name: Check out code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Build libgit2 v1.9.4 system-wide
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libssh2-1-dev
        git -C vendor/libgit2 fetch --tags --force
        sudo env BUILD_LIBGIT_REF=v1.9.4 ./script/build-libgit2.sh --dynamic --system
    - name: Test
      run: make TEST_ARGS=-test.v test

  build-system-static:
    name: Go (system-wide static, bundled main)
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: stable
    - name: Check out code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Build libgit2 system-wide
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libssh2-1-dev
        sudo ./script/build-libgit2.sh --static --system
    - name: Test
      run: go test --count=1 --tags "static,system_libgit2,libgit2_reftable" ./...

  check-generate:
    name: Check generated files were not modified
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: stable
    - name: Check out code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libssh2-1-dev
        go install golang.org/x/tools/cmd/stringer@latest
    - name: Generate files
      run: |
        export PATH=$(go env GOPATH)/bin:$PATH
        make generate
    - name: Check nothing changed
      run: git diff --quiet --exit-code || (echo "detected changes after generate"; git status; exit 1)
