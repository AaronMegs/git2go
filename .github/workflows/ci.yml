name: git2go CI
on:
  pull_request:
  push:
    branches:
    - main
    - release-*
    - v*

jobs:

  build-static:
    strategy:
      fail-fast: false
      matrix:
        go: [ '1.11', '1.12', '1.13', '1.14', '1.15', '1.16', '1.17' ]
    name: Go ${{ matrix.go }}

    runs-on: ubuntu-20.04

    steps:
    - name: Set up Go
      uses: actions/setup-go@v1
      with:
        go-version: ${{ matrix.go }}
      id: go
    - name: Check out code into the Go module directory
      uses: actions/checkout@v1
    - name: Build
      run: |
        git submodule update --init
        sudo apt-get install -y --no-install-recommends libssh2-1-dev
        make build-libgit2-static
    - name: Test
      run:  make TEST_ARGS=-test.v test-static

  build-dynamic:
    strategy:
      fail-fast: false
    name: Go (dynamic)

    runs-on: ubuntu-20.04

    steps:
    - name: Set up Go
      uses: actions/setup-go@v1
      with:
        go-version: '1.17'
      id: go
    - name: Check out code into the Go module directory
      uses: actions/checkout@v1
    - name: Build
      run: |
        git submodule update --init
        sudo apt-get install -y --no-install-recommends libssh2-1-dev
        make build-libgit2-dynamic
    - name: Test
      run: make TEST_ARGS=-test.v test-dynamic

  # Reference-storage backend matrix (dual track).
  #
  # The vendored libgit2 submodule is pinned to a main commit that includes
  # reftable support (PR #7117 + #7327). Reftable bindings are gated behind the
  # `libgit2_reftable` build tag so that git2go still compiles against released
  # libgit2 (v1.9.x) that lacks the reftable C symbols.
  #
  #   - build-reftable:          main libgit2 + `libgit2_reftable` tag; runs the
  #                              full reftable test suite (backend, compaction,
  #                              branch CRUD).
  #   - build-reftable-disabled: same library but WITHOUT the tag, i.e. the
  #                              stable-compatible subset that a v1.9.x user
  #                              would build. Reftable tests skip gracefully.
  build-reftable:
    strategy:
      fail-fast: false
    name: Reftable (bundled main, tag on)

    runs-on: ubuntu-22.04

    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
      id: go
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
    - name: Build libgit2 (bundled, main w/ reftable)
      run: |
        git submodule update --init
        make build-libgit2-static
    - name: Run reftable/refdb test suite (tag on)
      run: |
        go test --count=1 --tags "static libgit2_reftable" -v \
          -run 'Reftable|Refdb|RefStorage|InitRepositoryExt|IsReftableSupported|OpenRefdb' ./...
    - name: Verify a reftable repo is really created
      run: |
        go test --count=1 --tags "static libgit2_reftable" -v \
          -run 'TestInitRepositoryExtReftable|TestReftableBranchLifecycle' ./...

  build-reftable-disabled:
    strategy:
      fail-fast: false
    name: Reftable (stable-compat, tag off)

    runs-on: ubuntu-22.04

    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
      id: go
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
    - name: Build libgit2 (bundled)
      run: |
        git submodule update --init
        make build-libgit2-static
    # Build and test WITHOUT the libgit2_reftable tag: this is what a user on a
    # released libgit2 (no reftable C symbols) compiles. It must compile and the
    # reftable-specific tests must skip rather than fail.
    - name: Build core subset (no reftable tag)
      run: go build --tags static ./...
    - name: Test core subset (reftable tests skip)
      run: go test --count=1 --tags static -v ./...

  build-system-dynamic:
    strategy:
      fail-fast: false
      matrix:
        libgit2:
          - 'v1.5.0'
    name: Go (system-wide, dynamic)

    runs-on: ubuntu-20.04

    steps:
    - name: Set up Go
      uses: actions/setup-go@v1
      with:
        go-version: '1.17'
      id: go
    - name: Check out code into the Go module directory
      uses: actions/checkout@v1
    - name: Build libgit2 ${{ matrix.libgit2 }}
      run: |
        git submodule update --init
        sudo apt-get install -y --no-install-recommends libssh2-1-dev
        sudo env BUILD_LIBGIT_REF=${{ matrix.libgit2 }} ./script/build-libgit2.sh --dynamic --system
    - name: Test
      run: make TEST_ARGS=-test.v test

  build-system-static:
    strategy:
      fail-fast: false
    name: Go (system-wide, static)

    runs-on: ubuntu-20.04

    steps:
    - name: Set up Go
      uses: actions/setup-go@v1
      with:
        go-version: '1.17'
      id: go
    - name: Check out code into the Go module directory
      uses: actions/checkout@v1
    - name: Build libgit2
      run: |
        git submodule update --init
        sudo apt-get install -y --no-install-recommends libssh2-1-dev
        sudo ./script/build-libgit2.sh --static --system
    - name: Test
      run: go test --count=1 --tags "static,system_libgit2" ./...

  check-generate:
    name: Check generated files were not modified
    runs-on: ubuntu-20.04
    steps:
    - name: Set up Go
      uses: actions/setup-go@v1
      with:
        go-version: '1.17'
      id: go
    - name: Check out code into the Go module directory
      uses: actions/checkout@v2
    - name: Install libgit2 build dependencies
      run: |
        git submodule update --init
        sudo apt-get install -y --no-install-recommends libssh2-1-dev
        go install golang.org/x/tools/cmd/stringer@latest
    - name: Generate files
      run: |
        export PATH=$(go env GOPATH)/bin:$PATH
        make generate
    - name: Check nothing changed
      run: git diff --quiet --exit-code || (echo "detected changes after generate" ; git status ; exit 1)
