name: git2go CI
on:
  pull_request:
  push:
    branches:
    - main
    - release-*
    - v*

# vendor/ contains only the pinned libgit2 C submodule, so the Go toolchain's
# automatic -mod=vendor selection (Go 1.14+, triggered merely by vendor/
# existing) must be disabled or every job fails with "inconsistent vendoring".
# The Makefile sets this too; declaring it here covers the jobs that invoke go
# directly.
env:
  GOFLAGS: -mod=readonly

jobs:
  build-static:
    strategy:
      fail-fast: false
      matrix:
        go: [ '1.18', 'stable' ]
    name: Go ${{ matrix.go }} (bundled main, static)
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: ${{ matrix.go }}
    - name: Check out code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: recursive
    - name: Build libgit2
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libssh2-1-dev
        make build-libgit2-static
    - name: Test
      run: make TEST_ARGS=-test.v test-static

  build-static-macos:
    name: Go (bundled main, static, macOS)
    runs-on: macos-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: stable
    - name: Check out code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: recursive
    - name: Build libgit2
      run: make build-libgit2-static
    - name: Test
      run: make TEST_ARGS=-test.v test-static

  build-dynamic:
    name: Go (bundled main, dynamic)
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: stable
    - name: Check out code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: recursive
    - name: Build libgit2
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libssh2-1-dev
        make build-libgit2-dynamic
    - name: Test
      run: make TEST_ARGS=-test.v test-dynamic

  # v36-pre intentionally requires promoted typed OIDs from libgit2 main.
  # Released v1.9.4 belongs to the v35 maintenance line; this is a negative
  # compatibility test that ensures the ABI guard rejects it clearly.
  reject-legacy-v1-9-4:
    name: Reject legacy libgit2 v1.9.4 ABI
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: stable
    - name: Check out code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: recursive
    - name: Build libgit2 v1.9.4
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libssh2-1-dev
        git -C vendor/libgit2 fetch --tags --force
        BUILD_LIBGIT_REF=v1.9.4 make build-libgit2-static
    - name: Verify v36 ABI guard rejects the legacy git_oid layout
      run: |
        if go build --tags static ./... > /tmp/legacy-build.log 2>&1; then
          echo "expected v36-pre build against libgit2 v1.9.4 to fail"
          exit 1
        fi
        grep -q "requires promoted typed object ids" /tmp/legacy-build.log

  # Main/reftable track: exercises the backend itself and the Go-defined
  # backend bridge v2, including per-iterator handles and transaction locks.
  build-reftable:
    name: Reftable (bundled main, tag on)
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: stable
    - name: Check out code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: recursive
    - name: Build libgit2 main
      run: make build-libgit2-static
    - name: Run reftable/refdb suite
      run: |
        go test --count=1 --tags "static libgit2_reftable" -v \
          -run 'Reftable|Refdb|RefStorage|InitRepositoryExt|IsReftableSupported|OpenRefdb|Transaction' ./...
    - name: Run bridge concurrency tests with race detector
      run: |
        go test --count=1 --race --tags "static libgit2_reftable" -v \
          -run 'TestRefdbBackendConcurrentIterators|TestRefdbBackendTransaction' ./...

  build-static-deprecate-hard:
    name: Go (bundled main, static, DEPRECATE_HARD=ON)
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: stable
    - name: Check out code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: recursive
    - name: Build libgit2 with deprecated APIs hidden
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libssh2-1-dev
        BUILD_DEPRECATED_HARD=ON make build-libgit2-static
    - name: Test
      run: make TEST_ARGS=-test.v test-static

  build-system-dynamic-main:
    name: Go (system-wide dynamic, bundled main)
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: stable
    - name: Check out code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: recursive
    - name: Build libgit2 main system-wide
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libssh2-1-dev
        sudo ./script/build-libgit2.sh --dynamic --system
    - name: Test
      run: go test --count=1 --tags libgit2_reftable -v ./...

  build-system-static:
    name: Go (system-wide static, bundled main)
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: stable
    - name: Check out code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: recursive
    - name: Build libgit2 system-wide
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libssh2-1-dev
        sudo ./script/build-libgit2.sh --static --system
    - name: Test
      run: go test --count=1 --tags "static,system_libgit2,libgit2_reftable" ./...

  check-generate:
    name: Check generated files were not modified
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: stable
    - name: Check out code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: recursive
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libssh2-1-dev
        go install golang.org/x/tools/cmd/stringer@v0.1.12
    - name: Generate files
      run: |
        export PATH=$(go env GOPATH)/bin:$PATH
        make generate
    - name: Check nothing changed
      run: git diff --quiet --exit-code || (echo "detected changes after generate"; git status; exit 1)
